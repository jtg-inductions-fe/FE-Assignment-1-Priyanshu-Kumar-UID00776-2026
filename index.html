<!doctype html>
<html lang="en">
    <head>
        <title>Travel Point</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link
            rel="preload"
            href="/fonts/icons/Untitled.woff2"
            as="font"
            type="font/woff2"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <header class="header">
            <div class="header__background"></div>

            <a href="/" class="header__logo" aria-label="Travel Point Home">

                    src="/assets/images/logo.png"

                />
            </a>

            <button
                class="header__toggle"
                type="button"
                id="header-toggle"
                aria-label="Toggle Menu"
                aria-expanded="false"
                aria-controls="header-dropdown"

                <span
                    class="icon-menu"
                    aria-hidden="true"
                    id="toggle-icon-open"
                ></span>

                <span
                    class="icon-close hidden"
                    aria-hidden="true"
                    id="toggle-icon-close"
                ></span>
            </button>

            <nav class="header__nav" aria-label="Navigation Links">
                <ul class="header__nav-list">
                    <li class="header__nav-item">
                        <a href="/" class="header__link link link--primary"

                    </li>
                    <li class="header__nav-item">
                        <a href="/" class="header__link link link--primary"
                            >Discover</a
                        >
                    </li>
                    <li class="header__nav-item">

                            >Special Deals</a
                        >
                    </li>
                    <li class="header__nav-item">
                        <a href="/" class="header__link link link--primary"
                            >Contact</a
                        >

                aria-label="Mobile Dropdown Menu"
                id="header-dropdown"

                <div class="header__dropdown-brand">
                    <div class="header__dropdown-logo" aria-hidden="true">
                        <img

                        />

                    <span class="header__dropdown-name">Travel Point</span>
                </div>
                <nav class="header__dropdown-list-wrapper">
                    <ul class="header__dropdown-list">

                                class="header__dropdown-link link link--primary"

                <button type="button" class="btn btn--primary btn--compact">

            <section class="hero__design-info-wrapper">
                <div class="hero__design">
                    <div class="hero__design-images">
                        <div class="hero__design-earth">

                            />
                        </div>

                        <div class="hero__design-images-left">

                                <img

                                />

                                        class="icon-send"
                                        aria-hidden="true"
                                    ></span>
                                </div>
                            </div>
                            <div class="hero__design-images-left-wrapper">
                                <img
                                    src="/assets/images/hero-mountain.webp"
                                    alt=""
                                    class="hero__design-images-left-travel"
                                />
                            </div>
                        </div>
                        <div class="hero__design-images-right">

                                        class="icon-location"

                            >Explore the world!</span

                        <span class="icon-work" aria-hidden="true"></span>
                    </div>
                    <h1 class="hero__info-heading">
                        Travel
                        <span class="hero__info-highlight-heading"
                            >top destination</span

                        of the world

                    <p class="hero__info-detail">
                        We always make our customer happy by providing as many
                        choices as possible
                    </p>
                    <div class="hero__info-button-wrapper">

                            Get Started

                            class="btn btn--transparent btn--border"
                            type="button"
                        >

                                aria-hidden="true"
                            ></span>

                            Watch Demo

            />

                <ul class="hero__brand-list">
                    <li class="hero__brand-item">
                        <img
                            src="/assets/images/trip-advisor.png"
                            alt="Trip Advisor"
                            width="150"
                            height="40"
                            class="hero__brand-images"
                        />
                    </li>
                    <li class="hero__brand-item">
                        <img
                            src="/assets/images/expedia.png"

                            height="40"

                    </li>
                    <li class="hero__brand-item">
                        <img
                            src="/assets/images/booking-com.png"
                            alt="Booking.com"
                            width="150"
                            height="40"
                            class="hero__brand-images"
                        />
                    </li>
                    <li class="hero__brand-item">
                        <img
                            src="/assets/images/air-bnb.png"
                            alt="Airbnb"
                            width="150"
                            height="40"
                            class="hero__brand-images"
                        />
                    </li>
                    <li class="hero__brand-item">
                        <img
                            src="/assets/images/orbitz.png"
                            alt="Orbitz"
                            width="150"
                            height="40"
                            class="hero__brand-images"
                        />
                    </li>
                </ul>
            </div>
