<!doctype html>
<html lang="en">
    <head>
        <title>Travel Point</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link
            rel="preload"
            href="/fonts/icons/Untitled.woff2"
            as="font"
            type="font/woff2"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <div class="home-layout">
            <header class="header">
                <div class="header__background"></div>

                <a href="/" class="header__logo" aria-label="Travel Point Home">
                    <img
                        src="/assets/images/logo.png"
                        alt=""
                        class="header__logo-image"
                    />
                </a>

                <button
                    class="header__toggle"
                    type="button"
                    id="header-toggle"
                    aria-label="Toggle Menu"
                    aria-expanded="false"
                    aria-controls="header-dropdown"
                >
                    <span class="icon" aria-hidden="true" id="toggle-icon-open"
                        ></span
                    >

                    <span
                        class="icon"
                        hidden
                        aria-hidden="true"
                        id="toggle-icon-close"
                    >
                        <span class="icon"></span>
                    </span>
                </button>

                <nav class="header__nav" aria-label="Navigation Links">
                    <ul class="header__nav-list">
                        <li class="header__nav-item">
                            <a href="/" class="header__link link link--primary"
                                >Home</a
                            >
                        </li>
                        <li class="header__nav-item">
                            <a href="/" class="header__link link link--primary"
                                >Discover</a
                            >
                        </li>
                        <li class="header__nav-item">
                            <a href="/" class="header__link link link--primary"
                                >Special Deals</a
                            >
                        </li>
                        <li class="header__nav-item">
                            <a href="/" class="header__link link link--primary"
                                >Contact</a
                            >
                        </li>
                    </ul>
                </nav>

                <div
                    class="header__dropdown"
                    aria-label="Mobile Dropdown Menu"
                    id="header-dropdown"
                >
                    <div class="header__dropdown-brand">
                        <div class="header__dropdown-logo" aria-hidden="true">
                            <img
                                src="/assets/images/logo.png"
                                alt=""
                                class="header__logo-image"
                            />
                        </div>
                        <span class="header__dropdown-name">Travel Point</span>
                    </div>
                    <nav class="header__dropdown-list-wrapper">
                        <ul class="header__dropdown-list">
                            <li class="header__dropdown-item">
                                <a
                                    href="/"
                                    class="header__dropdown-link link link--primary"
                                    >Home</a
                                >
                            </li>
                            <li class="header__dropdown-item">
                                <a
                                    href="/"
                                    class="header__dropdown-link link link--primary"
                                    >Discover</a
                                >
                            </li>
                            <li class="header__dropdown-item">
                                <a
                                    href="/"
                                    class="header__dropdown-link link link--primary"
                                    >Special Deals</a
                                >
                            </li>
                            <li class="header__dropdown-item">
                                <a
                                    href="/"
                                    class="header__dropdown-link link link--primary"
                                    >Contact</a
                                >
                            </li>
                        </ul>
                    </nav>

                    <div class="header__actions header__actions--dropdown">
                        <button
                            type="button"
                            class="btn btn--primary btn--primary-dropdown-button"
                        >
                            Login
                        </button>
                        <button
                            type="button"
                            class="btn btn--primary btn--primary-dropdown-button"
                        >
                            Sign Up
                        </button>
                    </div>
                </div>

                <div class="header__actions header__actions--tablet-display">
                    <button
                        type="button"
                        class="btn btn--transparent btn--primary-tablet-button"
                    >
                        Login
                    </button>
                    <button
                        type="button"
                        class="btn btn--primary btn--primary-tablet-button"
                    >
                        Sign Up
                    </button>
                </div>
            </header>
        </div>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
